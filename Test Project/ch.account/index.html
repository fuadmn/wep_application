<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chart of Accounts</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- SheetJS Excel Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>

<body class="bg-slate-100 min-h-screen p-4">

    <div class="max-w-7xl mx-auto">

        <!-- Title -->
        <h1 class="text-2xl font-bold text-slate-800 text-center mb-5">
            Chart of Accounts
        </h1>

        <!-- Success Message -->
        <div
            id="successMessage"
            class="hidden mb-4 bg-blue-600 text-white text-sm font-medium p-3 rounded-lg text-center"
        >
            ✓ Account Added Successfully!
        </div>

        <!-- Main Layout -->
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-5">

            <!-- LEFT FORM -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">

                <h2 class="text-lg font-bold text-slate-700 mb-4">
                    Add Account
                </h2>

                <form id="accountForm" class="space-y-4">

                    <!-- Date -->
                    <div>
                        <label class="block text-sm font-medium mb-1">
                            Date
                        </label>

                        <input
                            id="date"
                            type="datetime-local"
                            required
                            class="w-full p-2 border border-slate-300 rounded-lg"
                        >
                    </div>

                    <!-- Number -->
                    <div>
                        <label class="block text-sm font-medium mb-1">
                            Number
                        </label>

                        <input
                            id="number"
                            type="number"
                            placeholder="101"
                            required
                            class="w-full p-2 border border-slate-300 rounded-lg"
                        >
                    </div>

                    <!-- Account Type -->
                    <div>

                        <label class="block text-sm font-medium mb-2">
                            Account Type
                        </label>

                        <div class="space-y-2 text-sm">

                            <label class="flex items-center gap-2">
                                <input
                                    type="radio"
                                    name="accountType"
                                    value="Assets"
                                    required
                                >
                                Assets
                            </label>

                            <label class="flex items-center gap-2">
                                <input
                                    type="radio"
                                    name="accountType"
                                    value="Liabilities"
                                >
                                Liabilities
                            </label>

                            <label class="flex items-center gap-2">
                                <input
                                    type="radio"
                                    name="accountType"
                                    value="Owner's Equity"
                                >
                                Owner's Equity
                            </label>

                            <label class="flex items-center gap-2">
                                <input
                                    type="radio"
                                    name="accountType"
                                    value="Revenue"
                                >
                                Revenue
                            </label>

                            <label class="flex items-center gap-2">
                                <input
                                    type="radio"
                                    name="accountType"
                                    value="Expense"
                                >
                                Expense
                            </label>

                            <label class="flex items-center gap-2">
                                <input
                                    type="radio"
                                    name="accountType"
                                    value="Temporary Account"
                                >
                                Temporary Account
                            </label>

                        </div>

                    </div>

                    <!-- Account Name -->
                    <div>

                        <label class="block text-sm font-medium mb-1">
                            Account Name
                        </label>

                        <input
                            id="accountName"
                            type="text"
                            placeholder="Cash"
                            required
                            class="w-full p-2 border border-slate-300 rounded-lg"
                        >

                    </div>

                    <!-- Balance -->
                    <div>

                        <label class="block text-sm font-medium mb-1">
                            Balance
                        </label>

                        <input
                            id="balance"
                            type="number"
                            placeholder="4990"
                            step="0.01"
                            required
                            class="w-full p-2 border border-slate-300 rounded-lg"
                        >

                    </div>

                    <!-- Add Button -->
                    <button
                        type="submit"
                        class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700"
                    >
                        + Add Account
                    </button>

                    <!-- Cancel Update -->
                    <button
                        type="button"
                        id="cancelEdit"
                        class="hidden w-full bg-slate-500 text-white py-2 rounded-lg hover:bg-slate-600"
                    >
                        Cancel Update
                    </button>

                </form>

            </div>


            <!-- RIGHT TABLE -->
            <div class="lg:col-span-3 bg-white p-5 rounded-xl shadow-sm border border-slate-200">

                <!-- Buttons -->
                <div class="flex flex-col md:flex-row gap-3 mb-5">

                    <!-- Search -->
                    <input
                        id="searchInput"
                        type="text"
                        placeholder="Search account..."
                        class="flex-1 p-2 border border-slate-300 rounded-lg"
                    >

                    <!-- Export -->
                    <button
                        id="exportExcel"
                        class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700"
                    >
                        Export Excel
                    </button>

                    <!-- Import -->
                    <input
                        type="file"
                        id="excelFile"
                        accept=".xlsx,.xls"
                        class="hidden"
                    >

                    <button
                        onclick="document.getElementById('excelFile').click()"
                        class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700"
                    >
                        Import Excel
                    </button>

                </div>


                <!-- Table -->
                <div class="overflow-x-auto">

                    <table class="w-full text-sm">

                        <thead>

                            <tr class="bg-slate-800 text-white">

                                <th class="p-3 text-left">
                                    No
                                </th>

                                <th class="p-3 text-left">
                                    Date
                                </th>

                                <th class="p-3 text-left">
                                    Number
                                </th>

                                <th class="p-3 text-left">
                                    Type
                                </th>

                                <th class="p-3 text-left">
                                    Account Name
                                </th>

                                <th class="p-3 text-right">
                                    Balance
                                </th>

                                <th class="p-3 text-center">
                                    Actions
                                </th>

                            </tr>

                        </thead>


                        <tbody id="accountTable">

                            <!-- Default Data -->

                            <tr class="border-b hover:bg-slate-50">

                                <td class="p-3">1</td>

                                <td class="p-3">
                                    9/4/2026, 2:13:09 PM
                                </td>

                                <td class="p-3 font-medium">
                                    101
                                </td>

                                <td class="p-3">
                                    Assets
                                </td>

                                <td class="p-3">
                                    Cash
                                </td>

                                <td class="p-3 text-right font-semibold">
                                    4,990
                                </td>

                                <td class="p-3 text-center">

                                    <button
                                        onclick="editRow(this)"
                                        class="bg-yellow-500 text-white px-3 py-1 rounded hover:bg-yellow-600"
                                    >
                                        Update
                                    </button>

                                    <button
                                        onclick="deleteRow(this)"
                                        class="bg-red-600 text-white px-3 py-1 rounded hover:bg-red-700 ml-1"
                                    >
                                        Delete
                                    </button>

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>


    <script>

        const form = document.getElementById("accountForm");
        const table = document.getElementById("accountTable");

        const successMessage =
            document.getElementById("successMessage");

        const cancelEdit =
            document.getElementById("cancelEdit");

        let editingRow = null;


        /* ADD OR UPDATE ACCOUNT */

        form.addEventListener("submit", function(event) {

            event.preventDefault();

            const date =
                document.getElementById("date").value;

            const number =
                document.getElementById("number").value;

            const selectedType =
                document.querySelector(
                    'input[name="accountType"]:checked'
                );

            const accountType =
                selectedType.value;

            const accountName =
                document.getElementById("accountName").value;

            const balance =
                document.getElementById("balance").value;

            const formattedBalance =
                Number(balance).toLocaleString();


            const formattedDate =
                new Date(date).toLocaleString();


            /* UPDATE */

            if (editingRow) {

                const cells =
                    editingRow.cells;

                cells[1].textContent =
                    formattedDate;

                cells[2].textContent =
                    number;

                cells[3].textContent =
                    accountType;

                cells[4].textContent =
                    accountName;

                cells[5].textContent =
                    formattedBalance;


                editingRow = null;

                form.querySelector(
                    'button[type="submit"]'
                ).textContent =
                    "+ Add Account";

                cancelEdit.classList.add(
                    "hidden"
                );

                showMessage(
                    "✓ Account Updated Successfully!"
                );

            }


            /* ADD */

            else {

                const rowNumber =
                    table.rows.length + 1;

                const newRow =
                    document.createElement("tr");

                newRow.className =
                    "border-b hover:bg-slate-50";

                newRow.innerHTML = `

                    <td class="p-3">
                        ${rowNumber}
                    </td>

                    <td class="p-3">
                        ${formattedDate}
                    </td>

                    <td class="p-3 font-medium">
                        ${number}
                    </td>

                    <td class="p-3">
                        ${accountType}
                    </td>

                    <td class="p-3">
                        ${accountName}
                    </td>

                    <td class="p-3 text-right font-semibold">
                        ${formattedBalance}
                    </td>

                    <td class="p-3 text-center">

                        <button
                            onclick="editRow(this)"
                            class="bg-yellow-500 text-white px-3 py-1 rounded"
                        >
                            Update
                        </button>

                        <button
                            onclick="deleteRow(this)"
                            class="bg-red-600 text-white px-3 py-1 rounded ml-1"
                        >
                            Delete
                        </button>

                    </td>

                `;

                table.appendChild(newRow);

                showMessage(
                    "✓ Account Added Successfully!"
                );

            }


            form.reset();

        });


        /* SUCCESS MESSAGE */

        function showMessage(message) {

            successMessage.textContent =
                message;

            successMessage.classList.remove(
                "hidden"
            );

            setTimeout(function() {

                successMessage.classList.add(
                    "hidden"
                );

            }, 3000);

        }


        /* DELETE */

        function deleteRow(button) {

            if (
                confirm(
                    "Are you sure you want to delete this account?"
                )
            ) {

                button.closest("tr").remove();

                updateRowNumbers();

                showMessage(
                    "✓ Account Deleted Successfully!"
                );

            }

        }


        /* UPDATE */

        function editRow(button) {

            editingRow =
                button.closest("tr");

            const cells =
                editingRow.cells;

            document.getElementById("number").value =
                cells[2].textContent.trim();

            document.getElementById("accountName").value =
                cells[4].textContent.trim();

            document.getElementById("balance").value =
                cells[5].textContent
                    .trim()
                    .replace(/,/g, "");


            const type =
                cells[3].textContent.trim();

            const radio =
                document.querySelector(
                    `input[name="accountType"][value="${type}"]`
                );

            if (radio) {

                radio.checked = true;

            }


            form.querySelector(
                'button[type="submit"]'
            ).textContent =
                "Update Account";

            cancelEdit.classList.remove(
                "hidden"
            );

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }


        /* CANCEL UPDATE */

        cancelEdit.addEventListener(
            "click",
            function() {

                editingRow = null;

                form.reset();

                form.querySelector(
                    'button[type="submit"]'
                ).textContent =
                    "+ Add Account";

                cancelEdit.classList.add(
                    "hidden"
                );

            }
        );


        /* UPDATE ROW NUMBERS */

        function updateRowNumbers() {

            Array.from(table.rows)
                .forEach(function(row, index) {

                    row.cells[0].textContent =
                        index + 1;

                });

        }


        /* SEARCH */

        document
            .getElementById("searchInput")
            .addEventListener(
                "keyup",
                function() {

                    const search =
                        this.value.toLowerCase();

                    Array.from(table.rows)
                        .forEach(function(row) {

                            const text =
                                row.textContent
                                    .toLowerCase();

                            row.style.display =
                                text.includes(search)
                                    ? ""
                                    : "none";

                        });

                }
            );


        /* EXPORT EXCEL */

        document
            .getElementById("exportExcel")
            .addEventListener(
                "click",
                function() {

                    const data = [
                        [
                            "No",
                            "Date",
                            "Number",
                            "Type",
                            "Account Name",
                            "Balance"
                        ]
                    ];

                    Array.from(table.rows)
                        .forEach(function(row) {

                            const cells =
                                row.cells;

                            data.push([
                                cells[0].textContent.trim(),
                                cells[1].textContent.trim(),
                                cells[2].textContent.trim(),
                                cells[3].textContent.trim(),
                                cells[4].textContent.trim(),
                                cells[5]
                                    .textContent
                                    .trim()
                                    .replace(/,/g, "")
                            ]);

                        });


                    const worksheet =
                        XLSX.utils.aoa_to_sheet(
                            data
                        );

                    const workbook =
                        XLSX.utils.book_new();

                    XLSX.utils.book_append_sheet(
                        workbook,
                        worksheet,
                        "Accounts"
                    );

                    XLSX.writeFile(
                        workbook,
                        "Chart_of_Accounts.xlsx"
                    );

                }
            );


        /* IMPORT EXCEL */

        document
            .getElementById("excelFile")
            .addEventListener(
                "change",
                function(event) {

                    const file =
                        event.target.files[0];

                    if (!file) return;

                    const reader =
                        new FileReader();


                    reader.onload =
                        function(e) {

                            const data =
                                new Uint8Array(
                                    e.target.result
                                );

                            const workbook =
                                XLSX.read(
                                    data,
                                    {
                                        type: "array"
                                    }
                                );

                            const sheetName =
                                workbook.SheetNames[0];

                            const worksheet =
                                workbook.Sheets[sheetName];

                            const excelData =
                                XLSX.utils.sheet_to_json(
                                    worksheet,
                                    {
                                        header: 1
                                    }
                                );


                            excelData
                                .slice(1)
                                .forEach(
                                    function(row) {

                                        if (
                                            !row ||
                                            row.length === 0
                                        ) return;


                                        const rowNumber =
                                            table.rows.length + 1;

                                        const newRow =
                                            document.createElement("tr");

                                        newRow.className =
                                            "border-b hover:bg-slate-50";


                                        const date =
                                            row[1] || "";

                                        const number =
                                            row[2] || "";

                                        const type =
                                            row[3] || "";

                                        const name =
                                            row[4] || "";

                                        const balance =
                                            Number(
                                                row[5] || 0
                                            );


                                        newRow.innerHTML = `

                                            <td class="p-3">
                                                ${rowNumber}
                                            </td>

                                            <td class="p-3">
                                                ${date}
                                            </td>

                                            <td class="p-3 font-medium">
                                                ${number}
                                            </td>

                                            <td class="p-3">
                                                ${type}
                                            </td>

                                            <td class="p-3">
                                                ${name}
                                            </td>

                                            <td class="p-3 text-right font-semibold">
                                                ${balance.toLocaleString()}
                                            </td>

                                            <td class="p-3 text-center">

                                                <button
                                                    onclick="editRow(this)"
                                                    class="bg-yellow-500 text-white px-3 py-1 rounded"
                                                >
                                                    Update
                                                </button>

                                                <button
                                                    onclick="deleteRow(this)"
                                                    class="bg-red-600 text-white px-3 py-1 rounded ml-1"
                                                >
                                                    Delete
                                                </button>

                                            </td>

                                        `;

                                        table.appendChild(
                                            newRow
                                        );

                                    }
                                );


                            showMessage(
                                "✓ Excel Imported Successfully!"
                            );

                        };


                    reader.readAsArrayBuffer(
                        file
                    );

                    event.target.value = "";

                }
            );

    </script>

</body>
</html>
